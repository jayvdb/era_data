# mise config: the tools and tasks that fetch the ERA journal lists, convert them to XML and SQL, load them into a
# database and test the result.
# Everything it downloads goes to build/downloads/, and everything it generates to build/.
#
#   mise install            Install the tools below
#   mise run                Run the whole pipeline against SQLite (the default task, `test`)
#   mise run test:pgsql     The same against PostgreSQL; also test:sqlite3, test:mysql and test:oracle
#   mise run test:all       The same against all four databases, one after another
#   mise run db:stop        Stop the database servers the tasks started
#   mise run check          Run the linters
#   mise tasks              List every task
#
# Each database runs locally, with its files under build/<db>/.
# PostgreSQL and MySQL are conda-forge builds that mise installs, listening only on 127.0.0.1, on ports of their
# own: TCP rather than a Unix socket, which MySQL has no equivalent of on Windows.
# Oracle is the gvenzl/oracle-free container, so test:oracle needs Docker.

min_version = "2026.10.15"

[settings]
experimental = true
# Fail fast on a missing tool rather than installing it on the fly.
exec_auto_install = false
task.run_auto_install = false
# Ignore .python-version and friends; versions are declared here.
idiomatic_version_file_enable_tools = []
# Hide tool releases younger than a week, so a broken or malicious release is usually pulled before it resolves.
minimum_release_age = "7d"
# Have uv create the .venv below.
python.uv_venv_auto = true

[tools]
# The conda:mysql metapackage puts no commands on PATH: mise exposes only a package's own executables.
"conda:mysql-client" = "latest"
"conda:mysql-server" = "latest"
"conda:postgresql" = "latest"
# conda-forge builds of sqlite are self-contained; the asdf plugin's builds link a zlib that is not shipped.
"conda:sqlite" = "latest"
# ryl ships no macOS x86_64 build, so it is built from source there; every other platform takes the release binary.
"cargo:ryl" = { version = "latest", os = ["macos/x64"] }
"github:owenlamont/ryl" = { version = "latest", os = ["linux", "macos/arm64", "windows"] }
# aqua/github ship no Windows build of action-validator, so it is scoped off Windows, where no check runs.
action-validator = { version = "latest", os = ["linux", "macos"] }
actionlint = "latest"
dprint = "latest"
editorconfig-checker = "latest"
# agent-lint publishes binaries for Linux and Apple-silicon macOS only, so it is scoped to those.
"github:zhupanov/agent-lint" = { version = "latest", os = ["linux", "macos/arm64"] }
# node builds the website in web/, and on Vercel is the one tool installed.
node = "24"
"pipx:pyrefly" = "latest"
# semgrep 1.182.0 is the last release with a macOS x86_64 wheel, so macos/x64 stays on it.
# Its pyjwt dependency pulls cryptography, whose 48.x is likewise the last with a macOS x86_64 wheel.
# mise rejects an empty `with`, so every other platform gets an empty JSON list.
"pipx:semgrep".version = "{% if os() == 'macos' and arch() == 'x64' %}1.182.0{% else %}latest{% endif %}"
"pipx:semgrep".with = '{% if os() == "macos" and arch() == "x64" %}["cryptography<49"]{% else %}[]{% endif %}'
# pyexcel and dicttoxml run on current CPython.
python = "3.14"
ruff = "latest"
# The Rust toolchain the rust/ crate builds with, and cargo:ryl on macOS x86_64.
# The `minimal` profile leaves out the docs, and the crate's checks need only clippy and rustfmt besides.
rust = { version = "stable", profile = "minimal", components = "clippy,rustfmt" }
# actionlint runs shellcheck over the workflows' `run:` steps.
shellcheck = "latest"
taplo = "latest"
typos = "latest"
uv = "latest"
zizmor = "latest"

# oxlint and oxfmt are oxc's JavaScript linter and formatter, for web/.
# They come from oxc's `apps_v<version>` GitHub release, which ships both: aqua's registry entry trips mise's date
# filter on the `apps_v` tag prefix (https://github.com/oxc-project/oxc/discussions/14452), and neither is a crates.io
# crate. `rename_exe` drops the target triple the release's binaries are named with, so each is on PATH by its name.
[tools."http:oxlint"]
bin = "oxlint"
rename_exe = "oxlint"
version = "1.73.0"
[tools."http:oxlint".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxlint".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-aarch64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-apple-darwin.tar.gz"
[tools."http:oxlint".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxlint-x86_64-pc-windows-msvc.zip"

[tools."http:oxfmt"]
bin = "oxfmt"
rename_exe = "oxfmt"
version = "1.73.0"
[tools."http:oxfmt".platforms.linux-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxfmt-aarch64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.linux-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxfmt-x86_64-unknown-linux-gnu.tar.gz"
[tools."http:oxfmt".platforms.macos-arm64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxfmt-aarch64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.macos-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxfmt-x86_64-apple-darwin.tar.gz"
[tools."http:oxfmt".platforms.windows-x64]
url = "https://github.com/oxc-project/oxc/releases/download/apps_v{{version}}/oxfmt-x86_64-pc-windows-msvc.zip"

[env]
_.python.venv = { path = ".venv", create = true }
# Python opens text files as UTF-8, as the data is, rather than in the locale encoding: cp1252 on Windows.
PYTHONUTF8 = "1"
# taplo reads its config from config/, rather than looking for one at the repository root.
TAPLO_CONFIG = "{{ config_root }}/config/taplo.toml"
# The database the pipeline loads into, from the caller's environment: sqlite3 (default), pgsql, mysql or oracle.
DB = "{{ get_env(name='DB', default='sqlite3') }}"
DBNAME = "era_data"
# Where the SQL for $DB is written, and where its server keeps its files.
DBDIR = "build/{{ get_env(name='DB', default='sqlite3') }}"
# Connection settings for the local servers, read by their command-line clients.
# The ports are not the defaults, so the servers start alongside any already installed.
MYSQL_TCP_PORT = "{{ get_env(name='MYSQL_TCP_PORT', default='53306') }}"
ORACLE_CONTAINER = "era_data-oracle"
ORACLE_PORT = "{{ get_env(name='ORACLE_PORT', default='1521') }}"
PGHOST = "127.0.0.1"
PGPORT = "{{ get_env(name='PGPORT', default='55432') }}"
PGUSER = "postgres"
# SQLAlchemy URL the tests connect to $DB with.
# The `-` in each tag trims the line breaks around it, so the value is the URL alone.
DBURL = """
{%- set db = get_env(name='DB', default='sqlite3') -%}
{%- set pg = get_env(name='PGPORT', default='55432') -%}
{%- set my = get_env(name='MYSQL_TCP_PORT', default='53306') -%}
{%- set ora = get_env(name='ORACLE_PORT', default='1521') -%}
{%- if db == 'pgsql' -%}postgresql+psycopg://postgres@127.0.0.1:{{ pg }}/era_data
{%- elif db == 'mysql' -%}mysql+pymysql://root@127.0.0.1:{{ my }}/era_data?charset=utf8mb4
{%- elif db == 'oracle' -%}oracle+oracledb://era_data:era_data@localhost:{{ ora }}/?service_name=FREEPDB1
{%- else -%}sqlite:///build/sqlite3/era_data.sqlite
{%- endif -%}
"""

[vars]
# The shell every task runs in: the bodies are POSIX shell, which on Windows is Git Bash's.
# mise's own default there is cmd, and it ignores a project config's windows_default_inline_shell_args.
shell = "bash -o errexit -c"
# Every TOML file in the repository: tracked ones and new ones not yet added, but nothing gitignored.
toml_files = "git ls-files -z --cached --others --exclude-standard '*.toml'"
# The journal lists the pipeline produces, each as `<file stem> <table prefix>`.
lists = """
ERA2010_journal_title_list era2010
ERA2012_journal_title_list era2012
ERA2015_journal_title_list era2015
ERA2015_consultation_journal_title_list era2015c
ERA2015_submitted_journal_title_list era2015s
ERA2018_journal_title_list era2018
ERA2023_journal_title_list era2023
ERA2023_original_journal_title_list era2023o
"""

[tasks.deps]
description = "Install the Python packages into .venv"
run = "uv pip install -r requirements.txt"
shell = "{{ vars.shell }}"

[tasks.download]
description = "Download the ERA tech packs, journal and conference lists and ANZSRC classifications to build/downloads/"
run = """
mkdir -p build/downloads
wayback=https://web.archive.org/web
arc=www.arc.gov.au
acu=www.acu.edu.au/__data/assets/excel_doc
arc_era=$arc/sites/default/files/filedepot/Public/ERA
abs2008=http://www.ausstats.abs.gov.au/ausstats/subscriber.nsf/0
abs2020=https://www.abs.gov.au/statistics/classifications
abs2020=$abs2020/australian-and-new-zealand-standard-research-classification-anzsrc/2020
# The ABS 2008 files, each under the document ID that the ABS file store keeps it in.
# Single quotes keep `$File`, which is part of each URL.
corr2008='0547F1ACF1FCAF93CA2574320012F0DC/$File/1297.0%20correspondence%20tables.xls'
fos2008='FC837D3FBE9EAFEACA257585001D7C72/$File/12970%20(2008)%20FOS%20(2007)%20Correspondence%20Table.xls'
nabs2008='5C5DE1F0FECC817CCA257585001BA569/$File/12970%20(2008)%20NABS%20(2007)%20Correspondence%20Table.xls'
while read -r url name; do
  [ -n "$url" ] || continue
  # Saved under the name after the URL, or else the end of the URL, with each encoded space made an underscore and
  # parentheses dropped.
  file="build/downloads/${name:-$(printf '%s' "${url##*/}" | sed 's/%20/_/g;s/[()]//g')}"
  if [ ! -s "$file" ]; then
    curl -fsSL --retry 5 --retry-all-errors -o "$file.part" "$url"
    mv "$file.part" "$file"
  fi
done <<EOF
$wayback/20150328231353/http://$arc/zip/ERA2010_tech_pack.zip
$wayback/20140212022156/http://$arc//zip/ERA-SEER2012-tech-pack.zip
$wayback/20140212022205/http://$arc/xls/era12/ERA2012JournalList.xlsx
$wayback/20160505174054/https://$acu/0003/674283/ERA_2015_Submission_Journal_List.xlsx
$wayback/20160505180743id_/https://$acu/0004/674284/ERA_2015_Submission_Conference_List.xlsx
$wayback/20150921024910/https://tqft.net/math/ERA2015.csv
$wayback/20160318210634/https://$arc_era/ERA%202015/ERA2015_Submitted_Journal_ListV2.xlsx
$wayback/20200402191539id_/https://$arc/file/10549/download?token=Sbfb2a9n ERA2018_Journal_List.xlsx
$wayback/20220903191004id_/https://$arc/sites/default/files/2022-07/ERA%202023%20Submission%20Journal%20List.xlsx
$wayback/20221101104238id_/https://$arc/sites/default/files/2022-07/ERA2023%20Submission%20Journal%20List.xlsx
$wayback/20101113155507id_/$abs2008/$corr2008
$wayback/20140217035128id_/$abs2008/$fos2008
$wayback/20140217035130id_/$abs2008/$nabs2008
$wayback/20210829220431id_/$abs2020/anzsrc2020_for.xlsx
$wayback/20210829220425id_/$abs2020/anzsrc2020_seo.xlsx
EOF
"""
shell = "{{ vars.shell }}"
# The URLs above:
# - The 2012 tech pack has no journal list in it, but is kept for reference.
#   ERA2012JournalList.xlsx is the ERA 2012 journal list, published on its own.
# - ERA_2015_Submission_Journal_List.xlsx is an online copy of the ERA 2015 journal list, and
#   ERA_2015_Submission_Conference_List.xlsx of its conference list.
#   The ERA 2018 and ERA 2023 conference lists went to universities, and no public copy of either is archived.
# - ERA2015.csv is the 2015 consultation journal list from http://jacci.arc.gov.au/, kindly provided by
#   https://sbseminar.wordpress.com/2014/02/24/australian-research-council-journal-list/
# - ERA2018_Journal_List.xlsx is the ERA 2018 journal list, linked from the ARC's ERA 2018 Journal List page, which
#   serves it as era_2018_journal_list.xlsx. The archive's first snapshot of it, at 20190822155724, is cut off at 1 MiB.
# - ERA_2023_Submission_Journal_List.xlsx is the ERA 2023 journal list as first published, on 26 July 2022, and
#   ERA2023_Submission_Journal_List.xlsx its revision, first archived on 1 November 2022. The ARC still serves both.
# - The last five are the ABS's Australian and New Zealand Standard Research Classification (ANZSRC), cat. no. 1297.0.
#   ERA 2010 to ERA 2018 used ANZSRC 2008, and ERA 2023 ANZSRC 2020; anzsrc_sql.py describes each file.
#   The 2020 snapshots are of the release of 30 June 2020, which the ABS has since replaced with corrected labels.
#   `id_` has the Internet Archive serve each of them exactly as archived.

[tasks.extract]
depends = ["download"]
description = "Extract the ERA 2010 journal and conference lists and the ERA 2012 tech pack"
outputs = [
  "build/downloads/ERA2010_tech_pack/code-table/ERA2010_conference_list.xls",
  "build/downloads/ERA2010_tech_pack/code-table/XML-Format/ERA2010_journal_title_list.xml",
]
run = """
python -m zipfile -e build/downloads/ERA2010_tech_pack.zip build/downloads/ERA2010_tech_pack
python -m zipfile -e build/downloads/ERA-SEER2012-tech-pack.zip build/downloads/ERA2012_tech_pack
"""
shell = "{{ vars.shell }}"
sources = ["build/downloads/ERA-SEER2012-tech-pack.zip", "build/downloads/ERA2010_tech_pack.zip"]

[tasks.convert]
depends = ["deps", "download"]
description = "Convert the ERA 2012, 2015, 2018 and 2023 spreadsheets to XML in the ERA 2010 journal list format"
outputs = [
  "build/ERA2012JournalList.xml",
  "build/ERA2015JournalList.xml",
  "build/ERA2015JournalList_consultation.xml",
  "build/ERA2015JournalList_submitted.xml",
  "build/ERA2018JournalList.xml",
  "build/ERA2023JournalList.xml",
  "build/ERA2023JournalList_original.xml",
]
# Each spreadsheet goes to generic XML with era_journal_list_xml.py, and era_journal_list_tidy.xsl turns that into
# the ERA 2010 layout. A line names the sheet to read after its output, when the list is not on the first sheet.
run = """
while read -r src out sheet; do
  [ -n "$src" ] || continue
  python era_journal_list_xml.py "build/downloads/$src" "build/$out" ${sheet:+"$sheet"}
  lxmlproc --output "build/$out.xml" era_journal_list_tidy.xsl "build/$out.messy-xml"
done <<'EOF'
ERA_2015_Submission_Journal_List.xlsx ERA2015JournalList
ERA2012JournalList.xlsx ERA2012JournalList
ERA2015.csv ERA2015JournalList_consultation
ERA2015_Submitted_Journal_ListV2.xlsx ERA2015JournalList_submitted
ERA2018_Journal_List.xlsx ERA2018JournalList ERA 2018 Journal List
ERA2023_Submission_Journal_List.xlsx ERA2023JournalList ERA2023 Submission Journal List
ERA_2023_Submission_Journal_List.xlsx ERA2023JournalList_original ERA2023 Submission Journal List
EOF
"""
shell = "{{ vars.shell }}"
sources = [
  "build/downloads/*.csv",
  "build/downloads/*.xlsx",
  "era_journal_list_tidy.xsl",
  "era_journal_list_xml.py",
  "requirements.txt",
]

[tasks.xml]
depends = ["convert", "extract"]
description = "Write the eight journal lists as build/ERA*_journal_title_list.xml, removing duplicate disciplines"
outputs = [
  "build/ERA2010_journal_title_list.xml",
  "build/ERA2012_journal_title_list.xml",
  "build/ERA2015_consultation_journal_title_list.xml",
  "build/ERA2015_journal_title_list.xml",
  "build/ERA2015_submitted_journal_title_list.xml",
  "build/ERA2018_journal_title_list.xml",
  "build/ERA2023_journal_title_list.xml",
  "build/ERA2023_original_journal_title_list.xml",
]
run = """
xsl=era_journal_list_2010_tidy.xsl
era2010=build/downloads/ERA2010_tech_pack/code-table/XML-Format/ERA2010_journal_title_list.xml
lxmlproc --output build/ERA2010_journal_title_list.xml "$xsl" "$era2010"
lxmlproc --output build/ERA2015_journal_title_list.xml "$xsl" build/ERA2015JournalList.xml
cp build/ERA2012JournalList.xml build/ERA2012_journal_title_list.xml
cp build/ERA2015JournalList_consultation.xml build/ERA2015_consultation_journal_title_list.xml
cp build/ERA2015JournalList_submitted.xml build/ERA2015_submitted_journal_title_list.xml
cp build/ERA2018JournalList.xml build/ERA2018_journal_title_list.xml
# Both ERA 2023 lists give journal 44852 the same field of research twice.
lxmlproc --output build/ERA2023_journal_title_list.xml "$xsl" build/ERA2023JournalList.xml
lxmlproc --output build/ERA2023_original_journal_title_list.xml "$xsl" build/ERA2023JournalList_original.xml
"""
shell = "{{ vars.shell }}"
sources = [
  "build/ERA20*JournalList*.xml",
  "build/downloads/ERA2010_tech_pack/code-table/XML-Format/ERA2010_journal_title_list.xml",
  "era_journal_list_2010_tidy.xsl",
]

[tasks.schema]
description = "Write the $DBDIR/schema*.sql for each journal list and ANZSRC edition, with types adjusted for $DB"
# MySQL 8 reserves RANK, so the rank column is quoted there.
run = """
mkdir -p "$DBDIR"
# Renames the tables of the schema in $1 from $2 to $3, and adjusts the column types for $DB.
schema() {
  sed -E "s/(^CREATE TABLE|REFERENCES|CONSTRAINT) $2([_ ])/\\1 $3\\2/g" "$1" |
    case "$DB" in
    mysql)
      sed -E 's/n?varchar2\\((1?[0-9][0-9]?)\\)/varchar(\\1)/;s/n?varchar2\\(([0-9]+)\\)/text(\\1)/' |
        sed -E 's/([^_a-z])rank([^_a-z])/\\1`rank`\\2/g'
      ;;
    pgsql) sed -E 's/n?varchar2\\(([0-9]+)\\)/varchar(\\1)/' ;;
    *) cat ;;
    esac
}
while read -r stem prefix; do
  [ -n "$stem" ] || continue
  out="$DBDIR/schema${stem#ERA}"
  out="${out%_journal_title_list}.sql"
  schema schema.sql journal "${prefix}_journal" >"$out"
done <<'EOF'
{{ vars.lists }}
EOF
for year in 2010 2015; do
  schema conference_schema.sql conference "era${year}_conference" >"$DBDIR/schema${year}_conference.sql"
done
# Each ANZSRC edition has a table for its Fields of Research and one for its Socio-Economic Objectives.
for edition in 2008 2020; do
  for classification in for seo; do
    schema anzsrc_schema.sql anzsrc "anzsrc${edition}_$classification"
  done >"$DBDIR/schema_anzsrc$edition.sql"
done
"""
shell = "{{ vars.shell }}"

[tasks.sql]
depends = ["deps", "download", "xml"]
description = "Convert each journal and conference list and each ANZSRC edition to SQL insert statements for $DB"
run = """
mkdir -p "$DBDIR"
while read -r stem prefix; do
  [ -n "$stem" ] || continue
  python era_journal_list_sql.py "build/$stem.xml" "$prefix" "$DB" >"$DBDIR/$stem.sql"
done <<'EOF'
{{ vars.lists }}
EOF
while read -r src prefix; do
  [ -n "$src" ] || continue
  out="$DBDIR/ERA${prefix#era}_conference_list.sql"
  python era_conference_list_sql.py "build/downloads/$src" "$prefix" "$DB" >"$out"
done <<'EOF'
ERA2010_tech_pack/code-table/ERA2010_conference_list.xls era2010
ERA_2015_Submission_Conference_List.xlsx era2015
EOF
for edition in 2008 2020; do
  python anzsrc_sql.py "$edition" build/downloads "$DB" >"$DBDIR/anzsrc$edition.sql"
done
"""
shell = "{{ vars.shell }}"

[tasks."db:start"]
description = "Start the $DB server, creating it on first use"
run = """
case "$DB" in
sqlite3) ;;
pgsql)
  if [ ! -f "$DBDIR/data/PG_VERSION" ]; then
    mkdir -p "$DBDIR"
    initdb -D "$DBDIR/data" -U postgres --auth=trust -E UTF8 --locale=C >"$DBDIR/initdb.log"
    { echo "listen_addresses = '127.0.0.1'"; echo "unix_socket_directories = ''"; } >>"$DBDIR/data/postgresql.conf"
  fi
  if ! pg_ctl status -D "$DBDIR/data" >/dev/null; then
    # On Windows the server inherits pg_ctl's stdout and stderr, which are the pipe mise reads this task from.
    # The server holds it open, so mise waits on it for as long as the server runs, and the job times out.
    # Pointing pg_ctl's own streams at a file instead leaves the server nothing of mise's to hold.
    set -- -w -D "$DBDIR/data" -l "$DBDIR/server.log" -o "-p $PGPORT"
    if ! pg_ctl start "$@" </dev/null >"$DBDIR/pg_ctl.log" 2>&1; then
      cat "$DBDIR/pg_ctl.log" "$DBDIR/server.log" >&2
      exit 1
    fi
  fi
  ;;
mysql)
  # mysqld needs absolute paths, which on Windows must be native ones, not Git Bash's /c/... form.
  native() { if command -v cygpath >/dev/null; then cygpath -m "$1"; else printf '%s\\n' "$1"; fi; }
  # mise runs mysqld through a wrapper script, so it cannot find its own plugins without being told where they are.
  # conda keeps them in lib/plugin, or Library/lib/plugin on Windows.
  plugin=$(find "$(mise where conda:mysql-server)" -name 'component_reference_cache.*' | head -n 1)
  set -- --no-defaults --datadir="$(native "$PWD/$DBDIR/data")" --log-error="$(native "$PWD/$DBDIR/server.log")"
  set -- "$@" --plugin-dir="$(native "$(dirname "$plugin")")"
  if [ ! -d "$DBDIR/data" ]; then
    mkdir -p "$DBDIR"
    mysqld "$@" --initialize-insecure
  fi
  # Whether the MySQL server on port $1 is this project's, the one keeping its data in build/mysql/data.
  ours() {
    dir=$(mysql -h 127.0.0.1 -P "$1" -u root -N -B -e 'SELECT @@datadir' 2>/dev/null) || return 1
    [ "$(cd "$dir" 2>/dev/null && pwd -P)" = "$(cd build/mysql/data 2>/dev/null && pwd -P)" ]
  }
  # A server already answering is reused only when it is this project's; db:create would drop its database.
  if mysqladmin -h 127.0.0.1 -P "$MYSQL_TCP_PORT" -u root ping >/dev/null 2>&1; then
    if ! ours "$MYSQL_TCP_PORT"; then
      echo "Another MySQL server is listening on 127.0.0.1:$MYSQL_TCP_PORT; set MYSQL_TCP_PORT to a free port" >&2
      exit 1
    fi
  else
    # Windows has no --daemonize, so mysqld goes in the background everywhere, and the task waits for it.
    set -- "$@" --bind-address=127.0.0.1 --port="$MYSQL_TCP_PORT" --mysqlx=OFF
    set -- "$@" --socket="$(native "$PWD/$DBDIR/mysql.sock")" --pid-file="$(native "$PWD/$DBDIR/mysqld.pid")"
    nohup mysqld "$@" >/dev/null 2>&1 &
    tries=0
    until mysqladmin -h 127.0.0.1 -P "$MYSQL_TCP_PORT" -u root ping >/dev/null 2>&1; do
      tries=$((tries + 1))
      if [ "$tries" -gt 60 ]; then
        cat "$DBDIR/server.log" >&2
        exit 1
      fi
      sleep 1
    done
    # db:stop reads the port back, so it stops this server even when MYSQL_TCP_PORT has changed since.
    echo "$MYSQL_TCP_PORT" >"$DBDIR/port"
  fi
  ;;
oracle)
  if docker container inspect "$ORACLE_CONTAINER" >/dev/null 2>&1; then
    docker start "$ORACLE_CONTAINER" >/dev/null
  else
    set -- -d --name "$ORACLE_CONTAINER" -p "127.0.0.1:$ORACLE_PORT:1521"
    set -- "$@" -e ORACLE_RANDOM_PASSWORD=yes -e APP_USER=era_data -e APP_USER_PASSWORD=era_data
    docker run "$@" gvenzl/oracle-free:23-slim-faststart >/dev/null
  fi
  tries=0
  until docker exec "$ORACLE_CONTAINER" healthcheck.sh >/dev/null 2>&1; do
    tries=$((tries + 1))
    if [ "$tries" -gt 60 ]; then
      docker logs "$ORACLE_CONTAINER" >&2
      exit 1
    fi
    sleep 5
  done
  ;;
*)
  echo "Unsupported DB=$DB; use sqlite3, pgsql, mysql or oracle" >&2
  exit 1
  ;;
esac
"""
shell = "{{ vars.shell }}"

[tasks."db:stop"]
description = "Stop every database server the tasks started"
run = """
# pg_ctl status rather than the pid file, which a crash or a reboot leaves behind with no server.
if [ -d build/pgsql/data ] && pg_ctl status -D build/pgsql/data >/dev/null; then
  pg_ctl stop -D build/pgsql/data -m fast
fi
# Whether the MySQL server on port $1 is this project's, the one keeping its data in build/mysql/data.
ours() {
  dir=$(mysql -h 127.0.0.1 -P "$1" -u root -N -B -e 'SELECT @@datadir' 2>/dev/null) || return 1
  [ "$(cd "$dir" 2>/dev/null && pwd -P)" = "$(cd build/mysql/data 2>/dev/null && pwd -P)" ]
}
# The port the server was started on, which db:start records, rather than whatever MYSQL_TCP_PORT is now.
# Only this project's server is shut down; another one answering on that port is left alone.
port=$(cat build/mysql/port 2>/dev/null || echo "$MYSQL_TCP_PORT")
if [ -d build/mysql/data ] && ours "$port"; then
  mysqladmin -h 127.0.0.1 -P "$port" -u root shutdown
  # mysqladmin returns once shutdown begins; mysqld removes its pid file when it has exited, so clean waits for that.
  tries=0
  while [ -f build/mysql/mysqld.pid ]; do
    tries=$((tries + 1))
    if [ "$tries" -gt 60 ]; then
      echo "mysqld has not exited after 60s" >&2
      exit 1
    fi
    sleep 1
  done
fi
if command -v docker >/dev/null && docker container inspect "$ORACLE_CONTAINER" >/dev/null 2>&1; then
  docker rm -f "$ORACLE_CONTAINER" >/dev/null
fi
"""
shell = "{{ vars.shell }}"

[tasks."db:create"]
depends = ["db:start"]
description = "Create an empty $DB database named era_data, dropping any existing one"
# The container's era_data user owns the Oracle tables, so emptying its schema stands in for a new database.
run = """
case "$DB" in
sqlite3) mkdir -p "$DBDIR" && rm -f "$DBDIR/$DBNAME.sqlite" ;;
pgsql) dropdb --if-exists "$DBNAME" && createdb "$DBNAME" ;;
mysql)
  sql="DROP DATABASE IF EXISTS $DBNAME; CREATE DATABASE $DBNAME CHARACTER SET utf8mb4;"
  mysql -h 127.0.0.1 -P "$MYSQL_TCP_PORT" -u root -e "$sql"
  ;;
oracle)
  docker exec -i "$ORACLE_CONTAINER" sqlplus -s -l era_data/era_data@FREEPDB1 <<'EOF'
WHENEVER SQLERROR EXIT FAILURE
BEGIN
  FOR t IN (SELECT table_name FROM user_tables) LOOP
    EXECUTE IMMEDIATE 'DROP TABLE "' || t.table_name || '" CASCADE CONSTRAINTS PURGE';
  END LOOP;
END;
/
EXIT
EOF
  ;;
esac
"""
shell = "{{ vars.shell }}"

[tasks."db:load"]
depends = ["db:create", "schema", "sql"]
description = "Create the tables and load the ERA lists and ANZSRC classifications into the $DB database"
run = """
# Runs a SQL script with the selected database's command-line client, as one transaction.
# The data scripts are one INSERT per row, and committing each row on its own takes hours.
sqlcmd() {
  case "$DB" in
  sqlite3) { echo 'BEGIN;'; cat "$1"; echo 'COMMIT;'; } | sqlite3 -bail "$DBDIR/$DBNAME.sqlite" ;;
  pgsql) psql -q -1 -v ON_ERROR_STOP=1 -f "$1" "$DBNAME" ;;
  mysql)
    { echo 'SET autocommit=0;'; cat "$1"; echo 'COMMIT;'; } |
      mysql -h 127.0.0.1 -P "$MYSQL_TCP_PORT" -u root --default-character-set=utf8mb4 "$DBNAME"
    ;;
  oracle)
    # cursor_sharing turns each INSERT's literals into binds, so Oracle parses the statement once rather than per row,
    # which loads about seven times faster.
    { echo 'WHENEVER SQLERROR EXIT FAILURE'; echo 'ALTER SESSION SET cursor_sharing = FORCE;'; cat "$1"
      echo 'COMMIT;'; echo 'EXIT'; } |
      docker exec -i "$ORACLE_CONTAINER" sqlplus -s -l era_data/era_data@FREEPDB1
    ;;
  esac
}
# The tables first, then the data.
for f in "$DBDIR"/schema20*.sql "$DBDIR"/schema_anzsrc*.sql; do sqlcmd "$f"; done
for f in "$DBDIR"/ERA20*_journal_title_list.sql "$DBDIR"/ERA20*_conference_list.sql "$DBDIR"/anzsrc20*.sql; do
  sqlcmd "$f"
done
"""
shell = "{{ vars.shell }}"

[tasks.test]
alias = "default"
depends = ["db:load", "deps"]
description = "Test the loaded $DB database with pytest"
run = 'pytest -o cache_dir=build/.pytest_cache --sqlalchemy-connect-url="$DBURL" tests'
shell = "{{ vars.shell }}"

# One task per database, each running the whole pipeline with DB set for it.
# A nested `mise run` rather than `depends`, because a task's env does not reach the tasks it depends on.
[tasks."test:sqlite3"]
description = "Run the pipeline and the tests against SQLite"
env = { DB = "sqlite3" }
run = "mise run test"
shell = "{{ vars.shell }}"

[tasks."test:pgsql"]
description = "Run the pipeline and the tests against a local PostgreSQL server"
env = { DB = "pgsql" }
run = "mise run test"
shell = "{{ vars.shell }}"

[tasks."test:mysql"]
description = "Run the pipeline and the tests against a local MySQL server"
env = { DB = "mysql" }
run = "mise run test"
shell = "{{ vars.shell }}"

[tasks."test:oracle"]
description = "Run the pipeline and the tests against Oracle Database Free in Docker"
env = { DB = "oracle" }
run = "mise run test"
shell = "{{ vars.shell }}"

[tasks."test:all"]
description = "Run the pipeline and the tests against every database, one after another"
# One after another, as each run regenerates the shared XML under build/.
run = ["mise run test:mysql", "mise run test:oracle", "mise run test:pgsql", "mise run test:sqlite3"]
shell = "{{ vars.shell }}"

[tasks.rdf]
depends = ["test:sqlite3"]
description = "Write build/era_data.nt.gz, the whole tested SQLite database as gzipped N-Triples"
run = "python era_rdf.py build/sqlite3/era_data.sqlite build/era_data.nt.gz"
shell = "{{ vars.shell }}"

[tasks.shacl]
depends = ["deps", "rdf"]
description = "Validate build/era_data.nt.gz against the SHACL shapes in vocab/shapes.ttl"
run = "python era_shacl.py build/era_data.nt.gz"
shell = "{{ vars.shell }}"

[tasks.vocab]
depends = ["deps"]
description = "Write VOCAB.md from vocab/vocab.ttl and vocab/shapes.ttl"
run = "python vocab_md.py"
shell = "{{ vars.shell }}"

[tasks.release]
depends = ["rdf", "shacl"]
description = "Write the release's files into build/release/: the database as SQLite and as N-Triples, with checksums"
# The release is the data this pipeline produces, in tested files that any language can read: era_data.sqlite.gz,
# and era_data.nt.gz, the triple store the python/ and rust/ packages download.
# None of the government's original files go in it.
# VACUUM INTO writes a compacted copy, and gzip -n leaves out the name and time, so the same data gives the same file.
run = """
rm -rf build/release
mkdir -p build/release
sqlite3 build/sqlite3/era_data.sqlite "VACUUM INTO 'build/release/era_data.sqlite'"
gzip -9 -n build/release/era_data.sqlite
cp build/era_data.nt.gz build/release/
cd build/release
for f in era_data.sqlite.gz era_data.nt.gz; do
  if command -v sha256sum >/dev/null; then
    sha256sum "$f" >"$f.sha256"
  else
    shasum -a 256 "$f" >"$f.sha256"
  fi
done
"""
shell = "{{ vars.shell }}"

[tasks.pin]
depends = ["rdf"]
description = "Pin the packages and the website to the release $TAG and the checksum of build/era_data.nt.gz"
# Run before pushing a data-v* tag, and commit the result: the release workflow refuses to publish otherwise.
run = """
: "${TAG:?set TAG to the release tag, such as data-v4}"
python pin.py "$TAG" build/era_data.nt.gz
"""
shell = "{{ vars.shell }}"

# The packages' tests read build/era_data.nt.gz rather than downloading the release's file.
[tasks.web]
description = "Build the website into web/dist: the search page in web/static and the triple store it loads"
# The triple store is the release's that pin.py pins the website to; ERA_DATA_NT names another copy to use instead,
# such as the pipeline's build/era_data.nt.gz. vercel.json has Vercel run this task, with node the only tool.
run = "node web/build.mjs"
shell = "{{ vars.shell }}"

[tasks."web:serve"]
depends = ["web"]
description = "Build the website, then serve web/dist at http://localhost:8000"
run = "python -m http.server --directory web/dist 8000"
shell = "{{ vars.shell }}"

[tasks."test:python"]
depends = ["deps", "rdf"]
description = "Test the python/ package against build/era_data.nt.gz"
env = { ERA_DATA_NT = "{{ config_root }}/build/era_data.nt.gz" }
run = """
uv pip install -e './python[test]'
pytest -o cache_dir=build/.pytest_cache python/tests
"""
shell = "{{ vars.shell }}"

[tasks."test:rust"]
depends = ["rdf"]
description = "Test the rust/ crate against build/era_data.nt.gz"
env = { ERA_DATA_NT = "{{ config_root }}/build/era_data.nt.gz" }
# --release, as an unoptimised build takes minutes to parse the 1.5 million triples.
run = "cargo test --workspace --release"
shell = "{{ vars.shell }}"

[tasks."test:packages"]
depends = ["test:python", "test:rust"]
description = "Test the python/ and rust/ packages"

[tasks.clean]
depends = ["db:stop"]
description = "Stop the database servers and remove everything under build/ but build/downloads/"
run = "find build -mindepth 1 -maxdepth 1 ! -name downloads -exec rm -rf {} +"
shell = "{{ vars.shell }}"

# Each package ships a copy of LICENSE, as neither can include a file from outside its own directory.
[tasks.license-check]
description = "Check python/LICENSE and rust/LICENSE are copies of LICENSE"
run = """
for copy in python/LICENSE rust/LICENSE; do
  cmp LICENSE "$copy" || { echo "$copy differs from LICENSE: copy LICENSE over it" >&2; exit 1; }
done
"""
shell = "{{ vars.shell }}"

[tasks.editorconfig-check]
alias = "ec"
run = "editorconfig-checker"
shell = "{{ vars.shell }}"

[tasks.taplo-check]
alias = "toml-check"
run = "{{ vars.toml_files }} | xargs -0 taplo lint"
shell = "{{ vars.shell }}"

[tasks.taplo-fmt]
alias = "toml-fmt"
run = "{{ vars.toml_files }} | xargs -0 taplo format"
shell = "{{ vars.shell }}"

[tasks.taplo-fmt-check]
alias = "toml-fmt-check"
run = "{{ vars.toml_files }} | xargs -0 taplo format --check"
shell = "{{ vars.shell }}"

[tasks.ryl-check]
alias = "yaml-check"
description = "Lint YAML with ryl (a yamllint-compatible Rust linter)"
run = "ryl check -c config/ryl.toml ."
shell = "{{ vars.shell }}"

[tasks.actionlint-check]
run = "actionlint"
shell = "{{ vars.shell }}"

[tasks.agent-lint-check]
description = "Lint this repository's agent instructions (AGENTS.md) with agent-lint"
# Skips where upstream ships no binary rather than failing on a missing one: the `[tools]` entry is os-scoped to the
# targets the release carries, so elsewhere there is nothing to install and nothing this could have run.
# macOS x86_64 is the case the os scope alone cannot express, since it scopes by OS and arch together.
run = """
case "$(uname -s)/$(uname -m)" in
Darwin/arm64 | Linux/*) agent-lint . ;;
*) echo "agent-lint-check: upstream publishes no $(uname -s) $(uname -m) binary; nothing to check on this host" ;;
esac
"""
shell = "{{ vars.shell }}"

[tasks.action-validator-check]
description = "Validate the GitHub Actions workflows against their schema"
run = "action-validator .github/workflows/*.yml"
shell = "{{ vars.shell }}"

[tasks.zizmor-check]
description = "Audit the GitHub Actions workflows for security issues (zizmor)"
# --offline so it needs no GH token and stays deterministic.
# config/zizmor.yaml turns off the hash-pin policy (we pin actions by tag, not commit).
run = "zizmor --offline --no-progress -c config/zizmor.yaml .github/workflows"
shell = "{{ vars.shell }}"

[tasks.gha-uses-check]
description = "Reject GitHub Actions pinned by commit hash rather than by tag"
# zizmor can require a hash pin but has no policy that forbids one, so this is the other half of config/zizmor.yaml.
run = """
if grep -nE '^[[:space:]-]*uses:[[:space:]]*[^[:space:]#]+@[0-9a-f]{40}' .github/workflows/*.yml; then
  echo 'Pin these actions by tag (`@v4`), not by commit hash; Dependabot keeps the tags current.' >&2
  exit 1
fi
"""
shell = "{{ vars.shell }}"

[tasks.cargo-fmt-check]
run = "cargo fmt --all --check"
shell = "{{ vars.shell }}"

[tasks.cargo-clippy-check]
run = "cargo clippy --workspace --all-targets -- -D warnings"
shell = "{{ vars.shell }}"

[tasks.pyrefly-check]
run = "pyrefly check -c config/pyrefly.toml"
shell = "{{ vars.shell }}"

[tasks.semgrep-check]
description = "Run the Semgrep rules in config/semgrep (ASCII-only text)"
run = "semgrep scan --config config/semgrep --error --metrics=off ."
shell = "{{ vars.shell }}"

[tasks.typos-check]
alias = "typos"
run = "typos --config config/typos.toml"
shell = "{{ vars.shell }}"

[tasks.typos-fix]
description = "Auto-correct typos detected by the typos linter"
run = "typos --config config/typos.toml --write-changes"
shell = "{{ vars.shell }}"

[tasks.ruff-check]
run = "ruff check --config config/ruff.toml"
shell = "{{ vars.shell }}"

[tasks.ruff-fmt-check]
run = "ruff format --check --config config/ruff.toml"
shell = "{{ vars.shell }}"

[tasks.ruff-fix]
run = "ruff check --fix --config config/ruff.toml"
shell = "{{ vars.shell }}"

[tasks.ruff-fmt]
run = "ruff format --config config/ruff.toml"
shell = "{{ vars.shell }}"

[tasks.dprint-check]
description = "Check the formatting of the CSS, HTML, JSON, Markdown and YAML with dprint"
env = { DPRINT_CACHE_DIR = "{{ config_root }}/build/dprint-cache" }
run = "dprint check"
shell = "{{ vars.shell }}"

[tasks.dprint-fmt]
description = "Format the CSS, HTML, JSON, Markdown and YAML with dprint"
env = { DPRINT_CACHE_DIR = "{{ config_root }}/build/dprint-cache" }
run = "dprint fmt"
shell = "{{ vars.shell }}"

[tasks.oxlint-check]
description = "Lint the JavaScript in web/ with oxlint"
# oxlint finds the files itself, leaving out what .gitignore does, such as web/dist/.
run = "oxlint --config config/oxlintrc.jsonc --deny-warnings"
shell = "{{ vars.shell }}"

[tasks.oxlint-fix]
description = "Fix what oxlint reports that it has a fix for"
run = "oxlint --config config/oxlintrc.jsonc --fix"
shell = "{{ vars.shell }}"

[tasks.oxfmt-check]
description = "Check the formatting of the JavaScript with oxfmt"
run = "oxfmt --config config/oxfmtrc.jsonc --check '**/*.js' '**/*.mjs'"
shell = "{{ vars.shell }}"

[tasks.oxfmt-fmt]
description = "Format the JavaScript with oxfmt"
run = "oxfmt --config config/oxfmtrc.jsonc --write '**/*.js' '**/*.mjs'"
shell = "{{ vars.shell }}"

[tasks.check]
depends = [
  "action-validator-check",
  "actionlint-check",
  "agent-lint-check",
  "cargo-clippy-check",
  "cargo-fmt-check",
  "dprint-check",
  "editorconfig-check",
  "gha-uses-check",
  "license-check",
  "oxfmt-check",
  "oxlint-check",
  "pyrefly-check",
  "ruff-check",
  "ruff-fmt-check",
  "ryl-check",
  "semgrep-check",
  "taplo-check",
  "taplo-fmt-check",
  "typos-check",
  "zizmor-check",
]
description = "Run all linters"
