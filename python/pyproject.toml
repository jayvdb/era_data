[project]
authors = [{ name = "John Vandenberg" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = ["platformdirs>=4", "rdflib>=7"]
description = "The ERA journal and conference lists and the ANZSRC classifications, as an RDF graph"
keywords = ["anzsrc", "australia", "era", "rdf", "research"]
license = "MIT"
license-files = ["LICENSE"]
name = "era-data"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jayvdb/era_data"
Issues = "https://github.com/jayvdb/era_data/issues"
Vocabulary = "https://github.com/jayvdb/era_data/blob/master/VOCAB.md"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
