[project]
dependencies = ["platformdirs>=4", "rdflib>=7"]
description = "The ERA journal and conference lists and the ANZSRC classifications, as an RDF graph"
license = "MIT"
name = "era-data"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/jayvdb/era_data"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
