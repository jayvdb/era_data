# zizmor GitHub Actions audit config, applied via `mise run zizmor-check`.
#
# We pin actions by tag (`@v4`), not by commit hash: tags are readable and Dependabot keeps them current. So the
# `unpinned-uses` audit's default hash-pin policy is turned off here -- `any` accepts a tag/branch ref.
# zizmor has no policy that rejects a hash pin, so `mise run gha-uses-check` does that.
rules:
  unpinned-uses:
    config:
      policies:
        "*": any
