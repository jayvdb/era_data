<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ERA journal lists</title>
    <meta
      name="description"
      content="Search the Excellence in Research for Australia journal and conference lists of 2010 to 2023."
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="github-corner" href="https://github.com/jayvdb/era_data" aria-label="era_data on GitHub">
      <svg viewBox="0 0 16 16" width="28" height="28" aria-hidden="true">
        <path
          fill="currentColor"
          d="
          M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2
          0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0
          0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16
          1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51
          1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68
          1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z
          "
        />
      </svg>
    </a>
    <header>
      <h1>ERA journal and conference lists</h1>
      <p>
        Every journal and conference on the Excellence in Research for Australia lists from 2010-2023, with their
        titles, ISSNs, ranks and FoR. The data is {{source}}, from
        <a href="https://github.com/jayvdb/era_data">era_data</a>, which describes its
        <a href="https://github.com/jayvdb/era_data/blob/master/VOCAB.md">vocabulary</a> and its
        <a href="https://github.com/jayvdb/era_data#copyright">copyright</a>.
      </p>
    </header>

    <main>
      <div id="bar">
        <form id="search" role="search" autocomplete="off">
          <label for="query" class="visually-hidden">Title, acronym, ISSN or ERA ID</label>
          <input id="query" type="search" placeholder="Title, acronym, ISSN or ERA ID" disabled />
          <label for="kind" class="visually-hidden">Journals or conferences</label>
          <select id="kind" disabled>
            <option value="">Journals and conferences</option>
            <option value="journal">Journals</option>
            <option value="conference">Conferences</option>
          </select>
        </form>
        <p id="summary" aria-live="polite"></p>
      </div>

      <section id="loading" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <div class="loading-text">
          <p id="loading-status">Starting</p>
          <progress id="loading-progress"></progress>
        </div>
      </section>

      <div id="panes">
        <ol id="results"></ol>
        <article id="detail" hidden></article>
      </div>
    </main>
  </body>
</html>
