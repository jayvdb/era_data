# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # pyexcel, pyexcel-io and pyexcel-xlsx only work with each other's matching versions.
      # Upgraded one at a time, each pull request fails, so they are always upgraded together in one.
      pyexcel:
        patterns:
          - "pyexcel"
          - "pyexcel-*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
