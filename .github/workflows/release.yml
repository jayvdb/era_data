name: Release

# A person releases by pushing a tag such as v2026.11.0; nothing here creates a tag or a release on its own.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and attach the data file
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release itself needs write access to the repository's contents; only this job has it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs mise and every tool in mise.toml.
      # GITHUB_TOKEN raises the api.github.com rate limit that mise's version lookups draw on.
      # No cache: a release is built from tools fetched afresh, never from a cache another run could have poisoned.
      - uses: jdx/mise-action@v5
        with:
          github_token: ${{ github.token }}
          cache: false

      # Downloads the sources afresh, runs the whole pipeline and its tests against SQLite, and writes the bundle.
      - name: Build the data file
        run: mise run release

      # The tag's release is created if it does not exist yet, and the files replace any of the same name.
      - name: Attach the data file to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes "era_data.sqlite.gz is every ERA journal list this repository processes, in one SQLite database."
          fi
          gh release upload "$TAG" build/release/era_data.sqlite.gz build/release/era_data.sqlite.gz.sha256 --clobber
