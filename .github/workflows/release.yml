name: Release

# A person releases by pushing a tag such as data-v4; nothing here creates a tag or a release on its own.
"on":
  push:
    tags:
      - "data-v*"
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and attach the data file
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release itself needs write access to the repository's contents; only this job has it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs mise and only the tools `mise run release` uses: Python, uv and SQLite.
      # This job can write to the repository and publishes the data file, so nothing else in mise.toml, the linters
      # especially, is installed onto its PATH, where a tampered release of one could shadow a command the build runs.
      # GITHUB_TOKEN raises the api.github.com rate limit that mise's version lookups draw on.
      # No cache: a release is built from tools fetched afresh, never from a cache another run could have poisoned.
      - uses: jdx/mise-action@v5
        with:
          github_token: ${{ github.token }}
          cache: false
          install_args: python uv conda:sqlite

      # Downloads the sources afresh, runs the whole pipeline and its tests against SQLite, and writes the bundle.
      - name: Build the data file
        run: mise run release

      # A data-v* release is the one the python/ and rust/ packages download, so its file must be the one they pin.
      # `mise run pin` pins them; this fails the release rather than publish a file the packages would reject.
      - name: Check the packages pin this file
        if: startsWith(github.ref_name, 'data-v')
        env:
          TAG: ${{ github.ref_name }}
        run: python pin.py --check "$TAG" build/release/era_data.nt.gz

      # The tag's release is created if it does not exist yet, and the files replace any of the same name.
      - name: Attach the data file to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="era_data.sqlite.gz is every ERA journal list and ANZSRC classification this repository processes,"
          notes="$notes in one SQLite database. era_data.nt.gz is its journals and ANZSRC codes as gzipped N-Triples,"
          notes="$notes without the order of each journal's ISSNs and fields of research."
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes"
          fi
          gh release upload "$TAG" build/release/era_data.sqlite.gz build/release/era_data.sqlite.gz.sha256 --clobber
          gh release upload "$TAG" build/release/era_data.nt.gz build/release/era_data.nt.gz.sha256 --clobber
